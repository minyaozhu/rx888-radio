<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rxapp</title>
<style>
:root{--bg:#F2F4EE;--bar:#FFFFFF;--ink:#1D2833;--muted:#5A6774;--line:#CBD3D8;--accent:#A3316F;--good:#2E7B57;--bad:#C0392B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0E151B;--bar:#151F27;--ink:#E4EAEE;--muted:#93A2AE;--line:#2B3843;--accent:#E07BB2;--good:#6CC99A;--bad:#FF6B6B}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0E151B;--bar:#151F27;--ink:#E4EAEE;--muted:#93A2AE;--line:#2B3843;--accent:#E07BB2;--good:#6CC99A;--bad:#FF6B6B}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;padding:0 16px;background:var(--bar);border-bottom:1px solid var(--line);min-height:46px}
.brand{font-weight:700;letter-spacing:.02em}
.brand span{color:var(--muted);font-weight:400}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav a{display:block;padding:13px 14px 11px;color:var(--muted);text-decoration:none;border-bottom:3px solid transparent;font-weight:600}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav a:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.spacer{flex:1}
.health{font:12px ui-monospace,"SF Mono",Menlo,monospace;color:var(--muted);white-space:nowrap}
.health i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted)}
.health.ok i{background:var(--good)} .health.bad i{background:var(--bad)}
main{position:relative;height:calc(100vh - 47px)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
iframe.on{display:block}
@media (max-width:640px){.health{display:none} nav a{padding:12px 9px 10px}}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">rxapp <span>· RX-888</span></div>
  <nav id="tabs" aria-label="Features"></nav>
  <div class="spacer"></div>
  <div class="health" id="health"><i></i>…</div>
</div>
<main id="frames"></main>
<script>
'use strict';
// One page per feature, each in its own frame. Frames are created on first visit and then kept, so a
// tab playing audio keeps playing while you look at another one.
const TABS = [
  {id: 'radio', label: 'Radio', src: 'radio.html'},
  {id: 'ft8', label: 'FT8 map', src: 'ft8.html'},
  {id: 'airband', label: 'Airband', src: 'airband.html'},
  {id: 'safety', label: 'Public safety', src: 'safety.html'},
  {id: 'sstv', label: 'SSTV', src: 'sstv.html'},
];
const nav = document.getElementById('tabs'), frames = document.getElementById('frames');
const made = {};
for (const t of TABS) {
  const a = document.createElement('a');
  a.href = '#' + t.id; a.textContent = t.label; a.dataset.id = t.id;
  nav.appendChild(a);
}
function show(id) {
  const t = TABS.find((x) => x.id === id) || TABS[0];
  if (!made[t.id]) {
    const f = document.createElement('iframe');
    f.src = t.src; f.title = t.label; f.allow = 'autoplay';
    frames.appendChild(f);
    made[t.id] = f;
  }
  for (const [k, f] of Object.entries(made)) f.classList.toggle('on', k === t.id);
  for (const a of nav.querySelectorAll('a')) {
    if (a.dataset.id === t.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  document.title = `${t.label} · rxapp`;
}
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1));

async function health() {
  const el = document.getElementById('health');
  try {
    const h = await (await fetch('/api/health')).json();
    const ok = h.ok;
    el.className = 'health ' + (ok ? 'ok' : 'bad');
    el.lastChild.textContent = ok ? `radiod · ${h.band.toUpperCase()}${h.band === 'vhf' && h.vhf && h.vhf.center_hz ? ' ' + (h.vhf.center_hz / 1e6).toFixed(1) + ' MHz' : ''} · ${h.overloads_recent ? h.overloads_recent + ' overloads' : 'no overloads'}` : 'radiod not answering';
  } catch (e) { el.className = 'health bad'; el.lastChild.textContent = 'rxapp not reachable'; }
}
health(); setInterval(health, 5000);
</script>
</body>
</html>
