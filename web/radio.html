<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rxapp · RX-888</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<header>
  <div class="brand">rxapp <span class="dim">RX-888 · radiod</span></div>
  <span id="focusBox" style="color:var(--text)"></span>
  <div id="health" class="health">connecting…</div>
</header>

<section class="tuner">
  <div class="seg" role="group" aria-label="Input">
    <button id="bandHF" class="seg-btn active" title="HF input: direct sampling">HF</button>
    <button id="bandVHF" class="seg-btn" title="VHF/UHF tuner (24-1700 MHz)">VHF</button>
  </div>
  <div class="freq-wrap">
    <button id="stepDown" class="stepbtn" title="Tune down one step (←; Shift: 10 steps)">◀</button>
    <input id="freq" class="freq" value="" spellcheck="false" aria-label="Frequency">
    <button id="stepUp" class="stepbtn" title="Tune up one step (→; Shift: 10 steps)">▶</button>
    <span id="unit" class="unit">kHz</span>
  </div>
  <label>Mode <select id="mode"></select></label>
  <label>Step <select id="step">
    <option value="10">10 Hz</option><option value="100">100 Hz</option><option value="500">500 Hz</option>
    <option value="1000">1 kHz</option><option value="5000">5 kHz</option><option value="10000" selected>10 kHz</option>
    <option value="12500">12.5 kHz</option><option value="25000">25 kHz</option><option value="100000">100 kHz</option>
    <option value="200000">200 kHz</option>
  </select></label>
  <button id="listen" class="primary">▶ Listen</button>
  <label class="vol">Vol <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7"></label>
  <button id="record">● Rec</button>
  <div class="meter">
    <div class="bar"><div id="meterfill"></div></div>
    <div id="meterText" class="dim">—</div>
  </div>
</section>

<section class="scope">
  <div class="scope-bar">
    <span id="viewInfo" class="dim"></span>
    <span class="spacer"></span>
    <label id="coverageWrap" title="HF coverage: restarts radiod at 64.8 MS/s (0-32 MHz) or 129.6 MS/s (0-64 MHz)">Coverage
      <select id="coverage"><option value="64800000">0–32 MHz</option><option value="129600000">0–64 MHz</option></select></label>
    <label id="hfGainWrap" title="HF front-end gain. Auto holds the ADC near -20 dBFS; below -10 dB the attenuator is used">Gain
      <input id="hfGain" type="range" min="-41.5" max="34" step="0.5"> <span id="hfGainVal" class="dim"></span>
      <label class="dim"><input id="hfAuto" type="checkbox"> Auto</label></label>
    <label id="vgaWrap" style="display:none" title="VHF tuner IF gain (0-15); the tuner's LNA and mixer run on their own AGC">Gain
      <input id="vga" type="range" min="0" max="15" step="1"> <span id="vgaVal" class="dim"></span></label>
    <label>Span <select id="zoom"></select></label>
    <button id="center" title="Center the view on the tuned frequency">Center</button>
    <label><input id="autoscale" type="checkbox" checked> auto levels</label>
  </div>
  <canvas id="spectrum" height="160"></canvas>
  <canvas id="waterfall" height="300"></canvas>
  <div class="hint dim">Click to tune · ← → or wheel to step (Shift ×10) · drag to pan <span id="flash" style="color:var(--text);margin-left:12px"></span></div>
</section>

<script src="app.js?v=13"></script>
<script src="focus.js?v=1" data-focus="pause" data-what="manual tuning"></script>
</body>
</html>
