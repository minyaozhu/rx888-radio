# radiod for rxapp: RX-888 at 64m8, no static channels (rxapp creates its own).
[global]
hardware = rx888
status = rx888-status.local
data = rx888-pcm.local
samprate = 12k
mode = am
ttl = 0          # keep multicast on this Mac
static = no
fft-threads = 1
verbose = 0

[rx888]
library = /Users/minyaozhu/ClaudeFileSystem/RX888/ka9q/../tools/ka9q-radio/src/rx888.so
firmware = /Users/minyaozhu/ClaudeFileSystem/RX888/ka9q/../tools/ka9q-radio/share/SDDC_FX3.img
samprate = 64m8
reference = 27m
