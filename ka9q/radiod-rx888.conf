# radiod on macOS with the RX-888 MkII (HF direct sampling)
# Run: ka9q/run_radiod.sh
[global]
hardware = rx888
status = rx888-status.local
data = rx888-pcm.local
samprate = 12k
mode = am
ttl = 0          # keep multicast on this Mac
static = no
verbose = 1

[rx888]
library = /Users/minyaozhu/ClaudeFileSystem/RX888/tools/ka9q-radio/src/rx888.so
firmware = /Users/minyaozhu/ClaudeFileSystem/RX888/tools/ka9q-radio/share/SDDC_FX3.img
samprate = 64m8  # half rate: 0-32 MHz; 129m6 for 0-64 MHz
reference = 27m

[am]
mode = am
freq = "860k 910k 730k 680k 740k 810k"
data = am.local
